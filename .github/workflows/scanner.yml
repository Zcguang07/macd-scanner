name: Multi-Timeframe Bottom Divergence Scanner

on:
  schedule:
    # 对应北京时间：下午 16:00 (UTC 8)、晚上 22:00 (UTC 14)、凌晨 01:00 (UTC 17)、早上 05:00 (UTC 21)、早上 09:00 (UTC 1)
    - cron: '0 8,14 * * 1-5'
    - cron: '0 17,21 * * 1-5'
    - cron: '0 1 * * 2-6'
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    defaults:
      run:
        working-directory: ./macd-main
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Long Only Agent
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python agent.py

      - name: Save memory (Commit sent_signals.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_signals.json || true
          git commit -m "auto: update sent signals memory" || true
          git pull origin main --rebase || true
          git push origin main || true
